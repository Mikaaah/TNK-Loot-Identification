name: Build NeoForge mod
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build and unit tests
        run: ./gradlew build --stacktrace
      - name: Dedicated server affix and identifier integration checks
        env:
          JAVA_TOOL_OPTIONS: -Dtnkloot.smokeTest=true
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout 300 ./gradlew runServer --stacktrace 2>&1 | tee smoke-test.log
          grep -q TNKLOOT_SMOKE_OK smoke-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TNK-Loot-0.6.1-alpha
          path: |
            build/libs/*.jar
            build/reports/tests/
            smoke-test.log
            run/logs/latest.log
