plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = '0.6.0-alpha'
group = 'dev.mikaaah.tnkloot'
base { archivesName = 'tnkloot' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        tnkloot { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.shadowsoffire.dev/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // Development runtime dependencies validate the required Apotheosis stack in NeoForge tests.
    implementation 'dev.shadowsoffire:Placebo:1.21.1-9.9.4'
    implementation('dev.shadowsoffire:ApothicAttributes:1.21.1-2.10.0') { exclude group: 'top.theillusivec4.curios' }
    implementation 'dev.shadowsoffire:ApothicSpawners:1.21.1-1.4.0'
    implementation('dev.shadowsoffire:ApothicEnchanting:1.21.1-1.6.2') { exclude group: 'top.theillusivec4.curios' }
    implementation('dev.shadowsoffire:Apotheosis:1.21.1-8.9.0') {
        // Optional upstream integrations are not required to boot the mod test runtime.
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'vazkii.patchouli', module: 'Patchouli'
    }
    runtimeOnly 'maven.modrinth:nU0bVIaL:h6hKI2ob'
}
tasks.named('test', Test) { useJUnitPlatform() }
java { withSourcesJar() }
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}

neoForge.unitTest {
    enable()
    testedMod = neoForge.mods.tnkloot
}

dependencies { testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }

// Forward console commands during the development server run.
tasks.named('runServer', JavaExec) { standardInput = System.in }
